<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Wireframe 07 — Registro (Código de verificación) | MC BACKPACK</title>
  <link rel="stylesheet" href="wireframe-kit.css">
</head>
<body class="page-wrap">

  <header class="wf-header">
    <div class="container header-inner">
      <div class="wf-logo">MC BACKPACK</div>
      <nav class="wf-nav">
        <a href="01-inicio.html">Inicio</a>
        <a href="02-tienda.html">Tienda</a>
        <a href="04-nosotros.html">Sobre</a>
        <a href="05-contacto.html">Contacto</a>
        <a href="16-ubicacion.html">Ubicación</a>
      </nav>
      <div class="wf-icons">
        <div class="wf-icon">🔍</div>
        <div class="wf-icon">👤</div>
        <div class="wf-icon">🛒</div>
      </div>
    </div>
  </header>

  <!-- Fondo degradado simulado (gris claro → gris medio) -->
  <div style="
    min-height: calc(100vh - 65px);
    background: linear-gradient(180deg, #e8e8e8 0%, #c8c8c8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  ">

    <!-- Tarjeta central -->
    <div style="
      width: 480px;
      text-align: center;
    ">

      <!-- Logo circular MC -->
      <div style="
        width: 120px; height: 120px;
        border: 2.5px solid #999;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 28px;
        background: #d8d8d8;
        font-size: 1.8rem; font-weight: 900; color: #555;
        letter-spacing: 0.05em;
      ">MC</div>

      <!-- Título -->
      <div style="font-size: 1.2rem; font-weight: 700; color: #333; margin-bottom: 8px;">
        Introducir código
      </div>

      <!-- Subtítulo -->
      <div style="font-size: 0.85rem; color: #666; margin-bottom: 24px;">
        Enviado a "JOHNDOE@gmail.com"
      </div>

      <!-- Input código 6 dígitos -->
      <input
        type="text"
        maxlength="6"
        placeholder="Código de seis dígitos"
        style="
          width: 100%;
          padding: 13px 16px;
          border: 1.5px solid #aaa;
          border-radius: 8px;
          font-size: 0.95rem;
          background: #fff;
          margin-bottom: 12px;
          text-align: left;
          display: block;
        "
      >

      <!-- Botón Enviar -->
      <button style="
        width: 100%;
        padding: 14px;
        background: #888;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 20px;
      ">Enviar</button>

      <!-- Link secundario -->
      <div style="font-size: 0.85rem; color: #555; font-weight: 700; margin-bottom: 40px;">
        Iniciar sesión con otro correo electrónico
      </div>

      <!-- Política de privacidad (pie) -->
      <div style="
        border: 1px solid #bbb;
        border-radius: 20px;
        display: inline-block;
        padding: 4px 16px;
        font-size: 0.72rem;
        color: #777;
        background: rgba(255,255,255,0.5);
      ">Política de privacidad</div>

    </div>
  </div>

</body>
</html>
