<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Wireframe 04 — Nosotros | MC BACKPACK</title>
  <link rel="stylesheet" href="wireframe-kit.css">
</head>
<body class="page-wrap">

  <!-- HEADER -->
  <header class="wf-header">
    <div class="container header-inner">
      <div class="wf-logo">MC BACKPACK</div>
      <nav class="wf-nav">
        <a href="01-inicio.html">Inicio</a>
        <a href="02-tienda.html">Tienda</a>
        <a href="04-nosotros.html" class="active">Sobre</a>
        <a href="05-contacto.html">Contacto</a>
        <a href="16-ubicacion.html">Ubicación</a>
      </nav>
      <div class="wf-icons">
        <div class="wf-icon">🔍</div>
        <div class="wf-icon">👤</div>
        <div class="wf-icon">🛒</div>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO SECTION (ESTILO WIREFRAME) -->
    <div style="position: relative; width: 100%; height: 500px; background: #e0e0e0; overflow: hidden; border-bottom: 2px solid var(--border);">
      
      <!-- Grid de imágenes inclinado a la derecha (Placeholders) -->
      <div style="
        position: absolute; right: 0; top: -20px; width: 600px; height: 500px;
        background: repeating-linear-gradient(45deg, transparent, transparent 120px, rgba(0,0,0,0.05) 120px, rgba(0,0,0,0.05) 125px);
        transform: rotate(15deg);
        z-index: 1;
      ">
        <div class="ph-img" style="position: absolute; right: 280px; top: 100px; width: 180px; height: 180px; border-radius: 8px;"></div>
        <div class="ph-img" style="position: absolute; right: 80px; top: 80px; width: 180px; height: 180px; border-radius: 8px;"></div>
        <div class="ph-img" style="position: absolute; right: 220px; top: 300px; width: 180px; height: 180px; border-radius: 8px;"></div>
        <div class="ph-img" style="position: absolute; right: 20px; top: 280px; width: 180px; height: 180px; border-radius: 8px;"></div>
      </div>

      <!-- Contenido estructural del Hero -->
      <div class="container" style="position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; justify-content: center;">
        <!-- Etiqueta superior -->
        <div style="width: 150px; height: 16px; background: #bbb; border-radius: 4px; margin-bottom: 16px;"></div>
        <!-- Título principal -->
        <div style="width: 600px; height: 48px; background: #999; border-radius: 6px; margin-bottom: 12px;"></div>
        <div style="width: 400px; height: 48px; background: #999; border-radius: 6px;"></div>
      </div>
    </div>

    <!-- BLOQUE DE TEXTO (HISTORIA) - SIMULADO SIN TEXTO -->
    <div style="background: var(--bg); padding: 80px 0 120px;">
      <div class="container" style="max-width: 900px; margin: 0 auto;">
        
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <!-- Líneas simulando el párrafo largo -->
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 100%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 100%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 95%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 100%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 100%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 92%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 100%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 100%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 98%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 100%;"></div>
          <div style="height: 14px; background: #ccc; border-radius: 4px; width: 80%;"></div>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER WIREFRAME -->
  <footer class="wf-footer">
    <div class="container">
      <div class="footer-cols">
        <div class="footer-col">
          <div style="width: 120px; height: 20px; background: #aaa; margin-bottom: 16px; border-radius: 4px;"></div>
          <div style="width: 180px; height: 12px; background: #ccc; margin-bottom: 8px; border-radius: 4px;"></div>
          <div style="width: 150px; height: 12px; background: #ccc; margin-bottom: 16px; border-radius: 4px;"></div>
          <div class="footer-icons">
            <div class="footer-icon"></div>
            <div class="footer-icon"></div>
            <div class="footer-icon"></div>
          </div>
        </div>
        <div class="footer-col">
          <div style="width: 80px; height: 16px; background: #aaa; margin-bottom: 16px; border-radius: 4px;"></div>
          <div style="width: 100px; height: 12px; background: #ccc; margin-bottom: 12px; border-radius: 4px;"></div>
          <div style="width: 80px; height: 12px; background: #ccc; margin-bottom: 12px; border-radius: 4px;"></div>
          <div style="width: 70px; height: 12px; background: #ccc; margin-bottom: 12px; border-radius: 4px;"></div>
          <div style="width: 110px; height: 12px; background: #ccc; margin-bottom: 12px; border-radius: 4px;"></div>
        </div>
        <div class="footer-col">
          <div style="width: 100px; height: 16px; background: #aaa; margin-bottom: 16px; border-radius: 4px;"></div>
          <div style="width: 220px; height: 12px; background: #ccc; margin-bottom: 20px; border-radius: 4px;"></div>
          <div class="newsletter-row">
            <input type="text" placeholder="" disabled style="background: #e0e0e0;">
            <button class="wf-btn" style="padding:8px 14px;" disabled></button>
          </div>
        </div>
      </div>
      <div class="footer-copy">© Wireframe</div>
    </div>
  </footer>

</body>
</html>
