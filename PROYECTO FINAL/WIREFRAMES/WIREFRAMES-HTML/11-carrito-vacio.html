<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Wireframe 11 — Carrito Vacío | MC BACKPACK</title>
  <link rel="stylesheet" href="wireframe-kit.css">
</head>
<body class="page-wrap">

  <header class="wf-header">
    <div class="container header-inner">
      <div class="wf-logo">MC BACKPACK</div>
      <nav class="wf-nav">
        <a href="01-inicio.html">Inicio</a>
        <a href="02-tienda.html">Tienda</a>
        <a href="04-nosotros.html">Sobre</a>
        <a href="05-contacto.html">Contacto</a>
        <a href="16-ubicacion.html">Ubicación</a>
      </nav>
      <div class="wf-icons">
        <div class="wf-icon">🔍</div>
        <div class="wf-icon">👤</div>
        <div class="wf-icon">🛒</div>
      </div>
    </div>
  </header>

  <!-- Panel lateral del carrito + overlay -->
  <div style="display:flex; min-height: calc(100vh - 65px);">

    <!-- Zona principal (izquierda, oscurecida) -->
    <div style="flex:1; background:#e8e8e8; display:flex; align-items:center; justify-content:center;">
      <div style="color:#aaa; font-size:0.9rem;">[Contenido de la página detrás del panel]</div>
    </div>

    <!-- Panel Carrito Lateral (derecha) -->
    <div class="wf-cart-panel" style="width:520px; min-height:100%; border-radius:0; border-left:2px solid #ccc; position:relative;">

      <div class="flex-between mb-24">
        <div class="wf-h2">Carrito</div>
        <div style="cursor:pointer; font-size:1.2rem; color:#888;">✕</div>
      </div>

      <!-- Logo circular MC -->
      <div class="flex-center" style="flex-direction:column; padding:60px 0 40px;">
        <div class="wf-auth-logo-circle" style="width:120px; height:120px; font-size:2rem; margin-bottom:16px;">MC</div>
        <div style="color:#888; font-size:0.95rem; margin-bottom:24px;">Su carrito está vacío</div>
        <a href="02-tienda.html" class="wf-btn" style="padding:14px 24px; font-size:0.85rem; letter-spacing:0.1em;">EMPEZAR A COMPRAR</a>
      </div>

      <hr style="border:none; border-top:1px solid #ddd; margin:24px 0;">

      <!-- Footer del panel -->
      <div style="font-size:0.75rem; color:#aaa; text-align:center;">
        Si continúas, aceptas nuestros
        <a href="09-terminos.html" style="color:#555; text-decoration:underline;">Términos del servicio</a>
        y la
        <a href="10-politicas.html" style="color:#555; text-decoration:underline;">Política de privacidad</a>
      </div>
    </div>

  </div>

</body>
</html>
