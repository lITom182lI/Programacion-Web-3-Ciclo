<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cronograma y mapa de ubicaciones de las próximas ferias itinerantes de Mochilas Locales.">
    <title>Ferias y Mapa - Mochilas Locales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <a href="#main-content" class="skip-link visually-hidden-focusable p-3 bg-white text-dark position-absolute top-0 start-0 z-3">Saltar al contenido principal</a>
    <!-- Navegación Accesible -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="../../PROGRAMA/IMAGENES/LOGO.png" alt="Logo de Mochilas Locales" width="40" height="40" class="me-2 rounded-circle" onerror="this.src='https://via.placeholder.com/40';">
                <strong>Mochilas Locales</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="ferias.html">Ubicación de Ferias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reserva.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" id="main-content">
        <h1 class="h2 mb-4">¿Dónde encontrarnos esta semana?</h1>
        
        <div class="row g-4">
            <!-- Mapa interactivo -->
            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h2 class="h5 mb-0">Ubicación de la Feria Actual</h2>
                    </div>
                    <div class="card-body p-0">
                        <!-- Mapa embebido de Google Maps -->
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3901.815777494191!2d-77.03158488518683!3d-12.056214591461421!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c8c6d48c8b67%3A0x6e6e2b83446002f2!2sParque%20de%20la%20Exposici%C3%B3n!5e0!3m2!1ses!2spe!4v1655000000000!5m2!1ses!2spe" 
                            width="100%" 
                            height="450" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade"
                            title="Mapa de Google Maps mostrando la ubicación de la feria itinerante">
                        </iframe>
                    </div>
                </div>
            </div>

            <!-- Lista de Ferias -->
            <div class="col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h2 class="h5 mb-0">Próximas Fechas</h2>
                    </div>
                    <ul class="list-group list-group-flush" id="listaFerias">
                        <li class="list-group-item p-4 text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ferias.js"></script>
</body>
</html>
