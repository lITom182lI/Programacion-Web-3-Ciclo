<head>

    <meta name="description" content="Formulario para separar tu mochila y contacto directo por WhatsApp.">
    <title>Contacto y Reservas - Mochilas Locales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <a href="#main-content" class="skip-link visually-hidden-focusable p-3 bg-white text-dark position-absolute top-0 start-0 z-3">Saltar al contenido principal</a>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="../../PROGRAMA/IMAGENES/LOGO.png" alt="Logo de Mochilas Locales" width="40" height="40" class="me-2 rounded-circle" onerror="this.src='https://via.placeholder.com/40';">
                <strong>Mochilas Locales</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Catálogo</a>

                    <li class="nav-item">
                        <a class="nav-link" href="ferias.html">Ubicación de Ferias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="reserva.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5" id="main-content">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h2 text-center mb-4">Reserva tu Mochila</h1>
                        
                        <p class="text-center text-muted mb-4">Completa el formulario para separar tu producto y coordinar la entrega en nuestra próxima feria o por envío.</p>
                        
                        <form id="formReserva">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre Completo</label>
                                <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" placeholder="Ej. María Quispe" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="celular" class="form-label fw-bold">Número de Celular</label>
                                <input type="tel" class="form-control form-control-lg" id="celular" name="celular" placeholder="Ej. 999 888 777" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="modelo" class="form-label fw-bold">Modelo que deseas reservar</label>
                                <select class="form-select form-select-lg" id="modelo" name="modelo" required>
                                    <option value="" selected disabled>Selecciona un producto...</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-bold">Mensaje Adicional (Opcional)</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="3" placeholder="Pregunta por colores disponibles, tallas, etc."></textarea>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg mb-3">Enviar Solicitud</button>
                            </div>
                            <div id="reservaMensaje"></div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <h2 class="h5 mb-3">¿Atención más rápida?</h2>
                            <!-- Botón gigante de WhatsApp por Accesibilidad -->
                            <a href="https://wa.me/51999999999" class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm d-flex justify-content-center align-items-center" aria-label="Contactar directamente por WhatsApp" target="_blank" rel="noopener noreferrer">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-whatsapp me-2" viewBox="0 0 16 16">
                                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                                </svg>
                                Escribir al WhatsApp
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/reserva.js"></script>
</body>
</html>
