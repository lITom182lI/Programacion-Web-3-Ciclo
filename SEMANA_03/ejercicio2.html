<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Cilindro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ea;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 10px;
        }

        .contenedor {
            background-color: white;
            max-width: 450px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.15);
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            font-weight: bold;
            color: #333;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1b5e20;
        }

        .resultado {
            margin-top: 20px;
            background-color: #dcedc8;
            border-left: 4px solid #2e7d32;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }

        .resultado p {
            margin: 6px 0;
            font-size: 15px;
            color: #1b3e1b;
        }

        .resultado p span {
            font-weight: bold;
        }

        .formula {
            background-color: #f9f9f9;
            border: 1px dashed #aaa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Ejercicio 2: Cilindro Regular</h1>

    <div class="contenedor">

        <label for="radio">Radio de la base (r):</label>
        <input type="number" id="radio" placeholder="Ej: 5" step="0.01">

        <label for="altura">Altura del cilindro (h):</label>
        <input type="number" id="altura" placeholder="Ej: 10" step="0.01">

        <button onclick="calcular()">Calcular</button>

        <div class="resultado" id="resultado">
            <p>Área total: <span id="area"></span> u²</p>
            <p>Volumen: <span id="volumen"></span> u³</p>
        </div>

        <div class="formula">
            <strong>Fórmulas utilizadas:</strong><br>
            Área total = 2πr² + 2πrh<br>
            Volumen = πr²h
        </div>

    </div>

    <script src="ejercicio2.js"></script>

</body>
</html>
