<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Trapecio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf3e7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #b45309;
            border-bottom: 2px solid #b45309;
            padding-bottom: 10px;
        }

        .contenedor {
            background-color: white;
            max-width: 450px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.15);
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            font-weight: bold;
            color: #333;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background-color: #b45309;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #92400e;
        }

        .resultado {
            margin-top: 20px;
            background-color: #fef3c7;
            border-left: 4px solid #b45309;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }

        .resultado p {
            margin: 6px 0;
            font-size: 15px;
            color: #4a2500;
        }

        .resultado p span {
            font-weight: bold;
        }

        .formula {
            background-color: #f9f9f9;
            border: 1px dashed #aaa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Ejercicio 3: Trapecio Regular</h1>

    <div class="contenedor">

        <label for="baseMayor">Base mayor (B):</label>
        <input type="number" id="baseMayor" placeholder="Ej: 10" step="0.01">

        <label for="baseMenor">Base menor (b):</label>
        <input type="number" id="baseMenor" placeholder="Ej: 6" step="0.01">

        <label for="altura">Altura (h):</label>
        <input type="number" id="altura" placeholder="Ej: 4" step="0.01">

        <button onclick="calcular()">Calcular</button>

        <div class="resultado" id="resultado">
            <p>Área: <span id="area"></span> u²</p>
            <p>Lado lateral (l): <span id="lado"></span> u</p>
            <p>Perímetro: <span id="perimetro"></span> u</p>
        </div>

        <div class="formula">
            <strong>Fórmulas utilizadas:</strong><br>
            Área = ((B + b) / 2) × h<br>
            Lado lateral = √(h² + ((B - b) / 2)²)<br>
            Perímetro = B + b + 2 × lado lateral
        </div>

    </div>

    <script src="ejercicio3.js"></script>

</body>
</html>
