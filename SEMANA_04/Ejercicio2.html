<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiantes</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f0f2f5; display: flex; 
            justify-content: center; 
            padding: 20px; 
        }

        .container { 
            background: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-bottom: 20px; 
        }

        input { 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
        }

        button#add-btn { 
            padding: 10px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
        }
        
        ul { 
            list-style: none; 
            padding: 0; 
        }
        
        li { 
            background: #fff; 
            border-bottom: 1px solid #eee; 
            padding: 10px; display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .del-btn { 
            background: #e74c3c; 
            color: white; 
            border: none; 
            padding: 5px 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 12px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Notas</h2>
    <div class="input-group">
        <input type="text" id="nombre" placeholder="Nombre del estudiante">
        <input type="number" id="nota" placeholder="Nota (0-10)">
        <button id="add-btn" onclick="agregarEstudiante()">Agregar Estudiante</button>
    </div>

    <ul id="listaEstudiantes"></ul>
</div>

<script>
    function agregarEstudiante() {
        const nombreInput = document.getElementById('nombre');
        const notaInput = document.getElementById('nota');
        const lista = document.getElementById('listaEstudiantes');

        if (nombreInput.value === "" || notaInput.value === "") return alert("Completa ambos campos");

        const li = document.createElement('li');
        li.innerHTML = `
            <span><strong>${nombreInput.value}</strong>: ${notaInput.value}</span>
            <button class="del-btn" onclick="this.parentElement.remove()">Eliminar</button>
        `;
        
        lista.appendChild(li);
        
        // Limpiar inputs
        nombreInput.value = "";
        notaInput.value = "";
    }
</script>

</body>
</html>
